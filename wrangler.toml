name = "serverless-discord-tickets"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Preserve dashboard variables/secrets across Git deploys.
# Without this, `wrangler deploy` deletes env vars not listed in [vars] below.
keep_vars = true

# KV namespace for Web UI configuration & 10-minute sessions (and optional ticket metadata).
[[kv_namespaces]]
binding = "TICKETS_KV"
id = "5e6ac7af6a2a466f9ffa458d3ad5bafd"

# [[d1_databases]]
# binding = "DB"
# database_name = "discord-tickets"
# database_id = "YOUR_D1_DATABASE_ID"

[vars]
# Non-secret defaults can go here. Secrets must use `wrangler secret put`.
